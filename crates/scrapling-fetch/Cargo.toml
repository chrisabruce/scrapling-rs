[package]
name = "scrapling-fetch"
description = "HTTP fetcher with TLS impersonation for scrapling"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
scrapling.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
bytes.workspace = true
rand.workspace = true
tracing.workspace = true
wreq = { version = "6.0.0-rc.28", features = ["cookies", "gzip", "brotli", "deflate", "json", "charset", "socks"] }
wreq-util = { version = "3.0.0-rc.10", features = ["emulation"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
